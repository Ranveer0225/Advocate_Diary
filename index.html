<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b35"><meta name="description" content="Offline-first advocate daily referencer and case diary"><link rel="manifest" href="manifest.webmanifest"><title>Advocate Diary</title>
<style>
:root{--ink:#1d2d2a;--muted:#697773;--green:#173b35;--green2:#24564c;--paper:#fffdf8;--bg:#f2f4f1;--line:#dce3dd;--gold:#c69a4b;--red:#a8443e;--blue:#355f87;--shadow:0 8px 24px #183a3210}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{background:var(--green);color:#fff;padding:14px max(16px,calc((100vw - 1250px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 3px 14px #102b2625}.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border:1px solid #ffffff55;border-radius:11px;display:grid;place-items:center;font-family:Georgia,serif;font-size:23px}.brand strong{display:block;font-family:Georgia,serif;font-size:19px;letter-spacing:.2px}.brand small{color:#c8d7d0;font-size:11px;letter-spacing:1.4px;text-transform:uppercase}.top-actions{display:flex;gap:8px;align-items:center}.top-actions button{background:#ffffff15;border:1px solid #ffffff35;color:#fff;border-radius:9px;padding:8px 11px}.shell{max-width:1250px;margin:auto;padding:18px 16px 50px}.nav{display:flex;gap:7px;overflow:auto;padding:0 0 14px;scrollbar-width:none}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:10px;font-weight:600}.nav button.active{background:var(--green);border-color:var(--green);color:#fff}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:5px 0 17px}.eyebrow{font-size:11px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:1.6px}.pagehead h1{font:29px/1.15 Georgia,serif;margin:3px 0 0;color:var(--green)}.sub{color:var(--muted);font-size:13px;margin-top:5px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:#fff;font-weight:650}.btn:hover{background:var(--green2)}.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.btn.light{background:#edf3ef;color:var(--green)}.btn.danger{background:#fff0ef;color:var(--red);border:1px solid #f0d2cf}.btn.small{padding:6px 9px;font-size:12px}.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:11px;border-radius:13px;box-shadow:var(--shadow);margin-bottom:14px}.datebar input{border:1px solid var(--line);padding:8px;border-radius:8px;color:var(--ink)}.datebar strong{margin-right:auto;color:var(--green)}.note-box{background:#fff9e9;border:1px solid #eadcb8;border-left:4px solid var(--gold);padding:13px 15px;border-radius:10px;margin-bottom:14px}.note-box label{font-weight:750;color:#715727;font-size:12px;text-transform:uppercase;letter-spacing:1px}.note-box textarea{width:100%;border:0;background:transparent;resize:vertical;min-height:43px;outline:none;color:var(--ink);padding:7px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}.stat b{display:block;font:24px Georgia,serif;color:var(--green)}.stat span{font-size:12px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.panelhead{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panelhead h2{margin:0;font:18px Georgia,serif;color:var(--green)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #edf0ec;vertical-align:top;font-size:13px}th{background:#f6f8f5;color:#586760;font-size:11px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}tr:last-child td{border-bottom:0}.case-title{font-weight:700;color:var(--green)}.muted{color:var(--muted)}.pill{display:inline-block;padding:3px 7px;border-radius:30px;background:#edf3ef;color:#315c4e;font-size:11px;font-weight:700}.pill.red{background:#fff0ef;color:#a8443e}.pill.gold{background:#fff6df;color:#80611f}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.empty{padding:35px 18px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--green);font:20px Georgia,serif;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow)}.card h3{margin:0 0 5px;color:var(--green);font:19px Georgia,serif}.card p{margin:4px 0;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.search{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;min-width:180px;flex:1}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#53625c}.field input,.field select,.field textarea{border:1px solid #d8e0da;border-radius:8px;padding:10px;background:#fff;color:var(--ink);width:100%;min-width:0}.field textarea{min-height:75px;resize:vertical}.hint{font-size:11px;color:var(--muted)}.modal{position:fixed;inset:0;background:#10231f80;z-index:30;display:none;align-items:flex-end;justify-content:center;padding:15px}.modal.show{display:flex}.dialog{background:#fff;border-radius:17px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 70px #0004}.dialoghead{position:sticky;top:0;background:#fff;padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}.dialoghead h2{margin:0;font:21px Georgia,serif;color:var(--green)}.dialogbody{padding:17px}.dialogfoot{display:flex;justify-content:flex-end;gap:8px;padding:13px 17px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}.x{border:0;background:#edf2ee;border-radius:8px;width:33px;height:33px;font-size:19px;color:var(--green)}.sectiontitle{font:17px Georgia,serif;color:var(--green);margin:17px 0 9px}.contact-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;margin-bottom:8px}.contact-row input{min-width:0;border:1px solid var(--line);padding:8px;border-radius:7px}.order-item,.history-item{padding:11px;border:1px solid var(--line);border-radius:9px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.footer{margin-top:20px;color:#7a8781;font-size:11px;text-align:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173b35;color:white;padding:11px 16px;border-radius:10px;z-index:50;box-shadow:var(--shadow);display:none}.toast.show{display:block}.checkline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
@media(max-width:700px){.topbar{padding:11px 13px}.brand strong{font-size:17px}.top-actions .toplabel{display:none}.shell{padding:13px 11px 40px}.pagehead h1{font-size:25px}.pagehead{align-items:center}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.fieldgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.datebar strong{width:100%}.datebar .btn{flex:1}.contact-row{grid-template-columns:1fr 1fr}.contact-row input:first-child{grid-column:1/-1}.modal{padding:0}.dialog{border-radius:17px 17px 0 0;max-height:94vh}.nav button{padding:8px 11px;font-size:13px}}

<body><div class="app"><header class="topbar"><div class="brand"><div class="logo">§</div><div><strong>Advocate Diary</strong><small>Daily Court Referencer</small></div></div><div class="top-actions"><button id="backupTop">⇩ <span class="toplabel">Backup</span></button><button id="restoreTop">⇧ <span class="toplabel">Restore</span></button></div></header><main class="shell"><nav class="nav" id="nav"><button class="active" data-page="diary">Daily Referencer</button><button data-page="cases">Case Register</button><button data-page="clients">Clients</button><button data-page="calendar">Calendar</button><button data-page="reminders">Notes & Reminders</button><button data-page="settings">Settings</button></nav><section id="view"></section><div class="footer">Advocate Diary · Local-first workspace · Your entries are stored in this browser on this device.</div></main></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">Add</h2><button class="x" id="modalClose">×</button></div><div class="dialogbody" id="modalBody"></div><div class="dialogfoot" id="modalFoot"></div></div></div><div class="toast" id="toast"></div><input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script>
const KEY='advocateDiary_v1';const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>Math.random().toString(36).slice(2,10).toUpperCase();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const defaultCols=[{key:'previousDate',label:'Previous Date'},{key:'caseNo',label:'Case No.'},{key:'court',label:'Name of Court'},{key:'parties',label:'Party Name / V/S'},{key:'stage',label:'Position / Stage'},{key:'nextDate',label:'Next Date'}];
let db=load(),page='diary',selectedDate=today(),editingCase=null,editingClient=null,detailCase=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch{return fresh()}}function fresh(){return {cases:[],clients:[],diaryNotes:{},reminders:[],columns:defaultCols,closedDays:[],settings:{}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function caseBy(id){return db.cases.find(c=>c.id===id)}function clientBy(id){return db.clients.find(c=>c.id===id)}function clientNames(c){return (c.clientIds||[]).map(id=>clientBy(id)?.name).filter(Boolean).join(', ')||c.partyNames||'—'}
function render(){let v=document.getElementById('view');if(page==='diary')v.innerHTML=diaryPage();if(page==='cases')v.innerHTML=casesPage();if(page==='clients')v.innerHTML=clientsPage();if(page==='calendar')v.innerHTML=calendarPage();if(page==='reminders')v.innerHTML=remindersPage();if(page==='settings')v.innerHTML=settingsPage();bindPage()}
function head(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">Advocate Diary</div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function diaryPage(){let rows=db.cases.filter(c=>c.nextDate===selectedDate||c.hearings?.some(h=>h.date===selectedDate));let closed=db.closedDays.includes(selectedDate);let cols=db.columns||defaultCols;let pending=rows.filter(c=>c.nextDate!==selectedDate);let due=rows.filter(c=>c.nextDate===selectedDate);let body=rows.length?rows.map(c=>`<tr>${cols.map(col=>`<td>${cellValue(c,col.key)}</td>`).join('')}<td><div class="row-actions"><button class="btn secondary small" data-action="case-detail" data-id="${c.id}">Open</button><button class="btn light small" data-action="update-hearing" data-id="${c.id}">Update</button></div></td></tr>`).join(''):`<tr><td colspan="${cols.length+1}"><div class="empty"><b>No matters listed for this date</b>Add a case or assign this date as its next hearing date.</div></td></tr>`;
return `${head('Daily Referencer','Your daily court list, proceedings and next dates',`<button class="btn" data-action="add-case">＋ Add Case</button>`)}<div class="datebar"><strong>Daily Court List</strong><button class="btn secondary small" data-action="date-prev">‹ Previous</button><input type="date" id="diaryDate" value="${selectedDate}"><button class="btn secondary small" data-action="date-next">Next ›</button><button class="btn light small" data-action="today">Today</button><span class="pill ${closed?'gold':''}">${closed?'Diary Closed':'Diary Open'}</span></div><div class="note-box"><label>Notes / Reminders for ${fmt(selectedDate)}</label><textarea id="dayNote" placeholder="Write today's important reminders, court timings or tasks...">${esc(db.diaryNotes[selectedDate]||'')}</textarea></div><div class="stats"><div class="stat"><b>${rows.length}</b><span>Total matters in this diary</span></div><div class="stat"><b>${due.length}</b><span>Next dates today</span></div><div class="stat"><b>${pending.length}</b><span>Still on today's list</span></div><div class="stat"><b>${db.cases.length}</b><span>Total registered cases</span></div></div><div class="panel"><div class="panelhead"><h2>Matters for ${fmt(selectedDate)}</h2><div class="toolbar"><button class="btn secondary small" data-action="columns">⚙ Columns</button><button class="btn secondary small" data-action="export-day">Export list</button></div></div><div class="tablewrap"><table><thead><tr>${cols.map(col=>`<th>${esc(col.label)}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${body}</tbody></table></div></div><div class="toolbar" style="justify-content:flex-end;margin-top:13px"><button class="btn secondary" data-action="reopen-day" ${!closed?'disabled':''}>Reopen Diary</button><button class="btn" data-action="close-day" ${closed?'disabled':''}>Close Today's Diary</button></div><p class="hint">Cases with no next date remain in this day's list until you close the diary. Closing preserves their records and places them in the follow-up queue.</p>`}
function cellValue(c,k){let vals={previousDate:fmt(c.previousDate),caseNo:`<b>${esc(c.caseNo||c.cnr||'—')}</b>${c.cnr&&c.caseNo?`<div class="hint">CNR: ${esc(c.cnr)}</div>`:''}`,court:esc(c.court||'—'),parties:esc(c.parties||clientNames(c)),stage:`<span class="pill">${esc(c.stage||'Pending')}</span>`,nextDate:c.nextDate?fmt(c.nextDate):'<span class="pill gold">Next Date Pending</span>',courtRoom:esc(c.courtRoom||'—'),serialNo:esc(c.serialNo||'—'),judge:esc(c.judge||'—'),purpose:esc(c.purpose||'—'),proceedings:esc(c.lastProceedings||'—'),priority:`<span class="pill ${c.priority==='Urgent'?'red':c.priority==='Important'?'gold':''}">${esc(c.priority||'Normal')}</span>`,caseType:esc(c.caseType||'—'),notes:esc(c.notes||'—'),filingDeadline:fmt(c.filingDeadline)};return vals[k]??esc(c[k]||'—')}
function casesPage(){return `${head('Case Register','All your matters in one searchable register',`<button class="btn" data-action="add-case">＋ Register Case</button>`)}<div class="toolbar" style="margin-bottom:13px"><input class="search" id="caseSearch" placeholder="Search case number, CNR, party, court or client..."><select id="caseFilter" class="search" style="max-width:190px;flex:0 1 190px"><option value="">All statuses</option><option>Pending</option><option>Adjourned</option><option>Heard</option><option>Disposed</option></select></div><div class="grid" id="caseCards">${caseCards(db.cases)}</div>`}
function caseCards(items){if(!items.length)return `<div class="panel empty" style="grid-column:1/-1"><b>No cases registered yet</b>Register your first matter to start using the Daily Referencer.</div>`;return items.map(c=>`<article class="card"><div class="toolbar" style="justify-content:space-between"><span class="pill">${esc(c.caseType||'Case')}</span><span class="pill ${c.status==='Disposed'?'gold':''}">${esc(c.status||'Pending')}</span></div><h3 style="margin-top:9px">${esc(c.caseNo||'Case number not entered')}</h3><p><b>${esc(c.parties||clientNames(c))}</b></p><p>${esc(c.court||'Court not specified')} ${c.cnr?'· CNR '+esc(c.cnr):''}</p><p>Next date: <b>${fmt(c.nextDate)}</b> · Stage: ${esc(c.stage||'—')}</p><div class="toolbar" style="margin-top:12px"><button class="btn small" data-action="case-detail" data-id="${c.id}">Open case</button><button class="btn secondary small" data-action="edit-case" data-id="${c.id}">Edit</button></div></article>`).join('')}
function clientsPage(){return `${head('Client Register','One permanent profile for each client',`<button class="btn" data-action="add-client">＋ Add Client</button>`)}<div class="toolbar" style="margin-bottom:13px"><input class="search" id="clientSearch" placeholder="Search client name, mobile, email or address..."></div><div class="grid" id="clientCards">${clientCards(db.clients)}</div>`}
function clientCards(items){if(!items.length)return `<div class="panel empty" style="grid-column:1/-1"><b>No clients added yet</b>Client profiles can be linked to one or more cases.</div>`;return items.map(c=>`<article class="card"><h3>${esc(c.name)}</h3><p>${esc(c.mobile||'No mobile number')} ${c.email?'· '+esc(c.email):''}</p><p>${esc(c.address||'Address not entered')}</p><p><b>${db.cases.filter(x=>(x.clientIds||[]).includes(c.id)).length}</b> linked case(s) · ${c.contacts?.length||0} additional contact(s)</p><div class="toolbar" style="margin-top:12px"><button class="btn small" data-action="client-detail" data-id="${c.id}">Open profile</button><button class="btn secondary small" data-action="edit-client" data-id="${c.id}">Edit</button></div></article>`).join('')}
function calendarPage(){let m=selectedDate.slice(0,7),first=new Date(m+'-01T00:00:00'),start=new Date(first);start.setDate(1-first.getDay());let days='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=d.toLocaleDateString('en-CA'),n=db.cases.filter(c=>c.nextDate===key).length;days+=`<button class="${key===selectedDate?'active':''}" data-action="calendar-day" data-date="${key}" style="min-height:64px;border:1px solid var(--line);border-radius:8px;background:${key===selectedDate?'#e7f0eb':'#fff'};color:var(--ink);text-align:left;padding:7px;opacity:${key.slice(0,7)===m?1:.4}"><b>${d.getDate()}</b>${n?`<div class="pill" style="margin-top:5px">${n} matter${n>1?'s':''}</div>`:''}</button>`}return `${head('Calendar','Monthly view of upcoming hearing dates')}<div class="panel" style="padding:14px"><div class="toolbar" style="justify-content:space-between;margin-bottom:12px"><button class="btn secondary small" data-action="month-prev">‹</button><b style="color:var(--green)">${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button class="btn secondary small" data-action="month-next">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="hint" style="text-align:center;font-weight:700">${x}</div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${days}</div></div><div class="panel" style="margin-top:13px"><div class="panelhead"><h2>Matters on ${fmt(selectedDate)}</h2></div><div class="tablewrap"><table><thead><tr><th>Case</th><th>Parties</th><th>Court</th><th>Stage</th></tr></thead><tbody>${db.cases.filter(c=>c.nextDate===selectedDate).map(c=>`<tr><td>${esc(c.caseNo)}</td><td>${esc(c.parties||clientNames(c))}</td><td>${esc(c.court)}</td><td>${esc(c.stage)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No matters scheduled.</td></tr>'}</tbody></table></div></div>`}
function remindersPage(){return `${head('Notes & Reminders','Follow-ups and important dates',`<button class="btn" data-action="add-reminder">＋ Add Reminder</button>`)}<div class="grid">${db.reminders.length?db.reminders.map(r=>`<article class="card"><div class="toolbar" style="justify-content:space-between"><span class="pill ${r.done?'gold':''}">${r.done?'Completed':'Pending'}</span><span class="hint">${fmt(r.date)}</span></div><h3>${esc(r.title)}</h3><p>${esc(r.note||'')}</p><div class="toolbar" style="margin-top:10px"><button class="btn secondary small" data-action="toggle-reminder" data-id="${r.id}">${r.done?'Reopen':'Mark done'}</button><button class="btn danger small" data-action="delete-reminder" data-id="${r.id}">Delete</button></div></article>`).join(''):'<div class="panel empty" style="grid-column:1/-1"><b>No reminders yet</b>Add filing deadlines, client follow-ups and other important tasks.</div>'}</div>`}
function settingsPage(){return `${head('Settings & Data','Customise your referencer and manage your local data')}<div class="grid"><div class="card"><h3>Daily Referencer columns</h3><p>Add, rename, remove and rearrange the columns shown in your daily diary.</p><button class="btn" data-action="columns">Customise columns</button></div><div class="card"><h3>Backup & Restore</h3><p>Export your cases, clients, diary notes, reminders and settings to a JSON backup file.</p><div class="toolbar"><button class="btn" data-action="backup">Download backup</button><button class="btn secondary" data-action="restore">Restore backup</button></div></div><div class="card"><h3>eCourts access</h3><p>Open official eCourts services to search CNR, case status and available orders. Complete any CAPTCHA on the official portal yourself.</p><a class="btn" style="display:inline-block;text-decoration:none" href="https://services.ecourts.gov.in/ecourtindia_v6/" target="_blank" rel="noopener">Open eCourts website ↗</a></div><div class="card"><h3>About local storage</h3><p>This initial web version stores data in this browser on this device. It does not yet have cloud synchronisation, multi-user login or server-side encrypted storage.</p><span class="pill gold">Keep regular backups</span></div></div>`}
function bindPage(){let dd=document.getElementById('diaryDate');if(dd)dd.onchange=()=>{selectedDate=dd.value;render()};let note=document.getElementById('dayNote');if(note)note.oninput=()=>{db.diaryNotes[selectedDate]=note.value;save()};let cs=document.getElementById('caseSearch');if(cs)cs.oninput=filterCases;let cf=document.getElementById('caseFilter');if(cf)cf.onchange=filterCases;let cl=document.getElementById('clientSearch');if(cl)cl.oninput=()=>{let q=cl.value.toLowerCase();document.getElementById('clientCards').innerHTML=clientCards(db.clients.filter(c=>JSON.stringify(c).toLowerCase().includes(q)))} }
function filterCases(){let q=document.getElementById('caseSearch').value.toLowerCase(),s=document.getElementById('caseFilter').value;document.getElementById('caseCards').innerHTML=caseCards(db.cases.filter(c=>(!s||c.status===s)&&JSON.stringify(c).toLowerCase().includes(q)))}
function modal(title,body,foot){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('modalClose').onclick=closeModal;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function caseForm(c={}){editingCase=c.id||null;let clients=db.clients.map(x=>`<option value="${x.id}" ${(c.clientIds||[]).includes(x.id)?'selected':''}>${esc(x.name)}</option>`).join('');modal(c.id?'Edit Case':'Register New Case',`<form id="caseForm"><div class="fieldgrid"><div class="field"><label>Case number</label><input name="caseNo" value="${esc(c.caseNo)}" placeholder="e.g. CS/125/2025"></div><div class="field"><label>CNR number</label><input name="cnr" value="${esc(c.cnr)}" placeholder="16-character CNR, if available"></div><div class="field"><label>Case title / Parties (A v B)</label><input name="parties" value="${esc(c.parties)}" placeholder="Petitioner v Respondent"></div><div class="field"><label>Case type</label><input name="caseType" value="${esc(c.caseType)}" placeholder="Civil, Criminal, Appeal..."></div><div class="field full"><label>Client(s) represented by you</label><select name="clientIds" multiple size="${Math.min(4,Math.max(2,db.clients.length))}">${clients}</select><span class="hint">Use Ctrl/Command on a computer to select multiple. On mobile, select one at a time; you can link more from case edit later.</span></div><div class="field"><label>Name of Court</label><input name="court" value="${esc(c.court)}" placeholder="Court / establishment"></div><div class="field"><label>Judge</label><input name="judge" value="${esc(c.judge)}"></div><div class="field"><label>Court room</label><input name="courtRoom" value="${esc(c.courtRoom)}"></div><div class="field"><label>Serial number</label><input name="serialNo" value="${esc(c.serialNo)}"></div><div class="field"><label>Previous hearing date</label><input name="previousDate" type="date" value="${esc(c.previousDate)}"></div><div class="field"><label>Next hearing date</label><input name="nextDate" type="date" value="${esc(c.nextDate)}"></div><div class="field"><label>Position / Stage</label><input name="stage" value="${esc(c.stage||'Pending')}" placeholder="Notice, arguments, evidence..."></div><div class="field"><label>Purpose of hearing</label><input name="purpose" value="${esc(c.purpose)}"></div><div class="field"><label>Status</label><select name="status">${['Pending','Adjourned','Heard','Disposed'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select name="priority">${['Normal','Important','Urgent'].map(s=>`<option ${c.priority===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field full"><label>Private advocate notes</label><textarea name="notes">${esc(c.notes)}</textarea></div></div></form>`,`<button class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" data-action="save-case">Save Case</button>`)}
function clientForm(c={}){editingClient=c.id||null;modal(c.id?'Edit Client':'Add Client',`<form id="clientForm"><div class="fieldgrid"><div class="field"><label>Full name *</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>Father's / Husband's name</label><input name="relative" value="${esc(c.relative)}"></div><div class="field"><label>Mobile number</label><input name="mobile" inputmode="tel" value="${esc(c.mobile)}"></div><div class="field"><label>WhatsApp number</label><input name="whatsapp" inputmode="tel" value="${esc(c.whatsapp)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(c.email)}"></div><div class="field"><label>Occupation</label><input name="occupation" value="${esc(c.occupation)}"></div><div class="field full"><label>Address</label><textarea name="address">${esc(c.address)}</textarea></div><div class="field full"><label>Identification reference (optional)</label><input name="identity" value="${esc(c.identity)}" placeholder="Optional reference only"></div><div class="field full"><label>Private notes</label><textarea name="notes">${esc(c.notes)}</textarea></div></div><div class="sectiontitle">Additional Contact Persons <span class="hint">· optional</span></div><div id="contacts">${(c.contacts||[]).map(contactRow).join('')}</div><button type="button" class="btn secondary small" id="addContact">＋ Add contact person</button></form>`,`<button class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" data-action="save-client">Save Client</button>`);document.getElementById('addContact').onclick=()=>document.getElementById('contacts').insertAdjacentHTML('beforeend',contactRow({}))}
function contactRow(x){return `<div class="contact-row"><input placeholder="Name" data-contact="name" value="${esc(x.name)}"><input placeholder="Designation" data-contact="designation" value="${esc(x.designation)}"><input placeholder="Mobile / email" data-contact="contact" value="${esc(x.contact)}"><button type="button" class="btn danger small" onclick="this.parentElement.remove()">×</button></div>`}
function caseDetail(id){detailCase=id;let c=caseBy(id);if(!c)return;let hist=(c.hearings||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));let orders=c.orders||[];modal('Case Record',`<div class="toolbar" style="justify-content:space-between"><span class="pill">${esc(c.status)}</span><span class="pill ${c.priority==='Urgent'?'red':''}">${esc(c.priority||'Normal')} priority</span></div><h2 style="font:24px Georgia,serif;color:var(--green);margin:12px 0 3px">${esc(c.caseNo||'Case')}</h2><p class="muted">${esc(c.parties||clientNames(c))} · ${esc(c.court||'Court not specified')}</p><div class="fieldgrid" style="margin-top:15px"><div><span class="hint">CNR</span><div>${esc(c.cnr||'—')}</div></div><div><span class="hint">Next date</span><div>${fmt(c.nextDate)}</div></div><div><span class="hint">Stage</span><div>${esc(c.stage||'—')}</div></div><div><span class="hint">Client(s)</span><div>${esc(clientNames(c))}</div></div></div><div class="toolbar" style="margin:15px 0"><button class="btn small" data-action="edit-case" data-id="${c.id}">Edit case</button><button class="btn secondary small" data-action="update-hearing" data-id="${c.id}">Record hearing</button><a class="btn secondary small" style="text-decoration:none" href="https://services.ecourts.gov.in/ecourtindia_v6/" target="_blank" rel="noopener">Open eCourts ↗</a></div><div class="sectiontitle">Quick Orders & Judgments</div><p class="hint">Add official order links or attach PDFs you have downloaded. Online availability depends on the official eCourts portal.</p><div>${orders.map((o,i)=>`<div class="order-item"><div><b>${esc(o.title||'Court Order')}</b><div class="hint">${fmt(o.date)} · ${esc(o.type||'Order')}</div></div><div class="toolbar">${o.url?`<a class="btn secondary small" href="${esc(o.url)}" target="_blank" rel="noopener">Open ↗</a>`:''}${o.fileName?`<span class="pill">${esc(o.fileName)}</span>`:''}<button class="btn danger small" data-action="delete-order" data-id="${c.id}" data-index="${i}">×</button></div></div>`).join('')||'<div class="empty" style="padding:15px">No orders saved in this record yet.</div>'}</div><button class="btn secondary small" data-action="add-order" data-id="${c.id}">＋ Add order link / record</button><div class="sectiontitle">Hearing History</div>${hist.map(h=>`<div class="history-item"><div><b>${fmt(h.date)}</b><div class="hint">${esc(h.stage||'Hearing')} · ${esc(h.proceedings||'No proceedings note')}</div></div><span class="pill">${esc(h.nextDate?('Next: '+fmt(h.nextDate)):'No next date')}</span></div>`).join('')||'<p class="muted">No hearing history recorded yet.</p>'}<div class="sectiontitle">Private Notes</div><p>${esc(c.notes||'No notes added.')}</p>`,`<button class="btn secondary" data-action="close-modal">Close</button><button class="btn" data-action="edit-case" data-id="${c.id}">Edit Case</button>`)}
function saveCase(){let f=document.getElementById('caseForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries());d.clientIds=Array.from(f.elements.clientIds.selectedOptions).map(o=>o.value);let old=caseBy(editingCase);let obj={...(old||{}),...d,id:old?.id||uid(),hearings:old?.hearings||[],orders:old?.orders||[],createdAt:old?.createdAt||new Date().toISOString()};if(old&&old.nextDate!==d.nextDate&&old.nextDate){obj.previousDate=old.nextDate}if(old){db.cases[db.cases.findIndex(x=>x.id===old.id)]=obj}else db.cases.push(obj);save();closeModal();render();toast('Case saved')}
function saveClient(){let f=document.getElementById('clientForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries());d.contacts=[...document.querySelectorAll('#contacts .contact-row')].map(r=>({name:r.querySelector('[data-contact="name"]').value,designation:r.querySelector('[data-contact="designation"]').value,contact:r.querySelector('[data-contact="contact"]').value})).filter(x=>x.name||x.contact);let old=clientBy(editingClient),obj={...(old||{}),...d,id:old?.id||uid(),createdAt:old?.createdAt||new Date().toISOString()};if(old)db.clients[db.clients.findIndex(x=>x.id===old.id)]=obj;else db.clients.push(obj);save();closeModal();render();toast('Client saved')}
function updateHearing(id){let c=caseBy(id);if(!c)return;modal('Record Hearing & Proceedings',`<form id="hearingForm"><div class="fieldgrid"><div class="field"><label>Hearing date</label><input name="date" type="date" value="${selectedDate}" required></div><div class="field"><label>Position / Stage</label><input name="stage" value="${esc(c.stage||'')}" placeholder="Evidence, arguments, notice..."></div><div class="field"><label>Next hearing date</label><input name="nextDate" type="date" value=""></div><div class="field"><label>Case status</label><select name="status">${['Pending','Adjourned','Heard','Disposed'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field full"><label>Today's proceedings / order summary</label><textarea name="proceedings" placeholder="What happened in court today?"></textarea></div></div></form>`,`<button class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" data-action="save-hearing" data-id="${id}">Save Proceedings</button>`)}
function saveHearing(id){let f=document.getElementById('hearingForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries()),c=caseBy(id);c.hearings=c.hearings||[];c.hearings.push({date:d.date,stage:d.stage,proceedings:d.proceedings,nextDate:d.nextDate});c.previousDate=d.date;c.stage=d.stage;c.status=d.status;c.lastProceedings=d.proceedings;c.nextDate=d.nextDate||'';save();closeModal();render();toast('Hearing history updated')}
function addOrder(id){modal('Add Quick Order',`<form id="orderForm"><div class="fieldgrid"><div class="field"><label>Order title / description</label><input name="title" placeholder="Order dated ..." required></div><div class="field"><label>Order date</label><input name="date" type="date"></div><div class="field"><label>Document type</label><select name="type"><option>Order</option><option>Judgment</option><option>Interim Order</option><option>Other</option></select></div><div class="field"><label>Official PDF / source URL</label><input name="url" type="url" placeholder="https://..."></div><div class="field full"><label>Local PDF (optional)</label><input name="file" type="file" accept="application/pdf"><span class="hint">A file name will be recorded here. For durable storage, keep the original PDF in your device files and back it up separately.</span></div></div></form>`,`<button class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" data-action="save-order" data-id="${id}">Save Order</button>`)}
function columnsModal(){let cols=db.columns||defaultCols;modal('Customise Daily Referencer',`<p class="hint">Add, rename, remove and reorder columns. These settings change only the diary view, not the underlying case records.</p><div id="colRows">${cols.map((c,i)=>`<div class="contact-row" data-col="${i}" style="grid-template-columns:1fr 90px auto auto"><input data-label value="${esc(c.label)}"><button class="btn secondary small" data-action="col-up" data-index="${i}">↑</button><button class="btn secondary small" data-action="col-down" data-index="${i}">↓</button><button class="btn danger small" data-action="col-delete" data-index="${i}">×</button></div>`).join('')}</div><div class="toolbar" style="margin-top:12px"><select id="newColumn" class="search"><option value="">Choose a field to add...</option>${[['courtRoom','Court Room'],['serialNo','Serial Number'],['judge','Judge Name'],['purpose','Purpose of Hearing'],['proceedings','Today’s Proceedings'],['priority','Priority'],['caseType','Case Type'],['notes','Advocate Notes'],['filingDeadline','Filing Deadline']].filter(x=>!cols.some(c=>c.key===x[0])).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><button class="btn secondary" data-action="col-add">Add column</button></div>`,`<button class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" data-action="save-columns">Save Layout</button>`)}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='advocate-diary-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')}
function restore(){document.getElementById('restoreFile').click()}document.getElementById('restoreFile').onchange=e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.cases||!x.clients)throw Error();if(confirm('Replace the current browser data with this backup? Download a backup of current data first if needed.')){db={...fresh(),...x};save();render();toast('Backup restored')}}catch{alert('This file is not a valid Advocate Diary backup.')}};r.readAsText(file);e.target.value=''};
function exportDay(){let rows=db.cases.filter(c=>c.nextDate===selectedDate||c.hearings?.some(h=>h.date===selectedDate));let text=['Previous Date,Case No,Court,Parties,Stage,Next Date',...rows.map(c=>[c.previousDate,c.caseNo,c.court,c.parties||clientNames(c),c.stage,c.nextDate].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='daily-referencer-'+selectedDate+'.csv';a.click();URL.revokeObjectURL(a.href)}
// All UI actions are delegated so mobile and desktop use the same controls.
document.body.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;switch(a){case'add-case':caseForm();break;case'edit-case':closeModal();caseForm(caseBy(id));break;case'add-client':clientForm();break;case'edit-client':closeModal();clientForm(clientBy(id));break;case'case-detail':caseDetail(id);break;case'client-detail':clientDetail(id);break;case'update-hearing':updateHearing(id);break;case'save-case':saveCase();break;case'save-client':saveClient();break;case'save-hearing':saveHearing(id);break;case'add-order':addOrder(id);break;case'save-order':saveOrder(id);break;case'delete-order':{let c=caseBy(id);c.orders.splice(+b.dataset.index,1);save();caseDetail(id);toast('Order entry removed');break}case'columns':columnsModal();break;case'col-up':moveCol(+b.dataset.index,-1);break;case'col-down':moveCol(+b.dataset.index,1);break;case'col-delete':{let cols=db.columns;cols.splice(+b.dataset.index,1);columnsModal();break}case'col-add':{let s=document.getElementById('newColumn'),opts={courtRoom:'Court Room',serialNo:'Serial Number',judge:'Judge Name',purpose:'Purpose of Hearing',proceedings:'Today’s Proceedings',priority:'Priority',caseType:'Case Type',notes:'Advocate Notes',filingDeadline:'Filing Deadline'};if(s.value){db.columns.push({key:s.value,label:opts[s.value]});columnsModal()}break}case'save-columns':saveColumns();break;case'date-prev':shiftDate(-1);break;case'date-next':shiftDate(1);break;case'today':selectedDate=today();render();break;case'close-day':closeDay();break;case'reopen-day':db.closedDays=db.closedDays.filter(d=>d!==selectedDate);save();render();toast('Diary reopened');break;case'export-day':exportDay();break;case'calendar-day':selectedDate=b.dataset.date;render();break;case'month-prev':shiftMonth(-1);break;case'month-next':shiftMonth(1);break;case'add-reminder':reminderForm();break;case'save-reminder':saveReminder();break;case'toggle-reminder':{let r=db.reminders.find(x=>x.id===id);r.done=!r.done;save();render();break}case'delete-reminder':db.reminders=db.reminders.filter(x=>x.id!==id);save();render();break;case'backup':backup();break;case'restore':restore();break;case'close-modal':closeModal();break;}}
);
function moveCol(i,delta){let a=db.columns,j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];columnsModal()}
function saveColumns(){let rows=[...document.querySelectorAll('#colRows .contact-row')];db.columns=rows.map((r,i)=>({key:db.columns[i]?.key,label:r.querySelector('[data-label]').value.trim()||db.columns[i]?.label||'Column'}));if(!db.columns.length){alert('Keep at least one diary column.');db.columns=defaultCols.slice()}save();closeModal();render();toast('Diary columns saved')}
function closeDay(){let unresolved=db.cases.filter(c=>(c.nextDate===selectedDate||c.hearings?.some(h=>h.date===selectedDate))&&!c.nextDate&&c.status!=='Disposed');let msg=unresolved.length?`${unresolved.length} matter(s) have no next date. They will remain in your records and appear in the follow-up list. Close this diary?`:'Close this date’s diary?';if(confirm(msg)){if(!db.closedDays.includes(selectedDate))db.closedDays.push(selectedDate);save();render();toast('Diary closed')}}
function shiftDate(n){let d=new Date(selectedDate+'T00:00:00');d.setDate(d.getDate()+n);selectedDate=d.toLocaleDateString('en-CA');render()}function shiftMonth(n){let d=new Date(selectedDate+'T00:00:00');d.setMonth(d.getMonth()+n);selectedDate=d.toLocaleDateString('en-CA');render()}
function saveOrder(id){let f=document.getElementById('orderForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries()),file=f.elements.file.files[0];let c=caseBy(id);c.orders=c.orders||[];c.orders.push({title:d.title,date:d.date,type:d.type,url:d.url,fileName:file?.name||''});save();caseDetail(id);toast('Order entry saved')}
function clientDetail(id){let c=clientBy(id);if(!c)return;let linked=db.cases.filter(x=>(x.clientIds||[]).includes(id));modal('Client Profile',`<h2 style="font:24px Georgia,serif;color:var(--green);margin:0">${esc(c.name)}</h2><p class="muted">${esc(c.relative||'')} · ${esc(c.occupation||'')}</p><div class="fieldgrid"><div><span class="hint">Mobile</span><div>${esc(c.mobile||'—')}</div></div><div><span class="hint">WhatsApp</span><div>${esc(c.whatsapp||'—')}</div></div><div><span class="hint">Email</span><div>${esc(c.email||'—')}</div></div><div><span class="hint">Address</span><div>${esc(c.address||'—')}</div></div></div><div class="sectiontitle">Linked Cases (${linked.length})</div>${linked.map(x=>`<div class="order-item"><div><b>${esc(x.caseNo)}</b><div class="hint">${esc(x.court)} · Next: ${fmt(x.nextDate)}</div></div><button class="btn secondary small" data-action="case-detail" data-id="${x.id}">Open</button></div>`).join('')||'<p class="muted">No cases linked.</p>'}<div class="sectiontitle">Additional Contact Persons</div>${(c.contacts||[]).map(x=>`<div class="order-item"><div><b>${esc(x.name)}</b><div class="hint">${esc(x.designation||'')} · ${esc(x.contact||'')}</div></div></div>`).join('')||'<p class="muted">None added.</p>'}<div class="sectiontitle">Private Notes</div><p>${esc(c.notes||'—')}</p>`,`<button class="btn secondary" data-action="close-modal">Close</button><button class="btn" data-action="edit-client" data-id="${id}">Edit Client</button>`)}
function reminderForm(){modal('Add Reminder',`<form id="reminderForm"><div class="fieldgrid"><div class="field"><label>Reminder title *</label><input name="title" required placeholder="e.g. File reply in ..."></div><div class="field"><label>Date</label><input name="date" type="date" value="${selectedDate}"></div><div class="field full"><label>Details</label><textarea name="note"></textarea></div></div></form>`,`<button class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" data-action="save-reminder">Save Reminder</button>`)}function saveReminder(){let f=document.getElementById('reminderForm');if(!f.reportValidity())return;db.reminders.push({...Object.fromEntries(new FormData(f).entries()),id:uid(),done:false});save();closeModal();render();toast('Reminder saved')}
// Header actions and keyboard-independent file controls.
document.getElementById('backupTop').onclick=backup;document.getElementById('restoreTop').onclick=restore;
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
